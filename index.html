function animateDraw(c){
  const source=document.querySelector('.deck-source .playingcard'),slot=document.getElementById('reveal-slot');
  if(!source||!slot)return;
  const a=source.getBoundingClientRect(),z=slot.getBoundingClientRect();
  const flying=document.createElement('div');flying.className='card-flight';
  flying.style.cssText=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;transform:translate(0px,0px) rotate(-7deg) scale(.94);transition:transform .66s cubic-bezier(.16,.8,.2,1)`;
  flying.innerHTML='<div class="flip-inner">'+cardHTML(null,true)+cardHTML(c).replace('playingcard ','playingcard face ')+'</div>';
  document.body.appendChild(flying);
  const end=slot.querySelector('.playingcard');if(end)end.classList.add('draw-dim');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    flying.style.transform=`translate(${z.left-a.left}px,${z.top-a.top}px) rotate(0deg) scale(1)`;
    setTimeout(()=>flying.classList.add('face-up'),290);
  }));
  setTimeout(()=>{flying.remove();if(end&&end.isConnected)end.classList.remove('draw-dim')},1050);
}
function fitScreen(){

 const previewScale=Math.min(1,(window.innerWidth-12)/390,(window.innerHeight-gap)/844);
 frame.style.setProperty('--preview-scale',String(Math.max(.1,previewScale)));
 screen.style.zoom='1';
 const available=document.querySelector('.device').clientHeight;
 const required=screen.scrollHeight;
 if(required>available){
   const scale=Math.max(.48,Math.min(1,(available-3)/required));
   screen.style.zoom=String(scale);
 }
}
